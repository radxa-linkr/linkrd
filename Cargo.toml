[package]
name = "linkrd"
version = "0.1.0"
edition = "2024"
authors = ["hiifong <f@f.style>"]
description = "USB ACM text clipboard synchronization agent for Linkr"

[features]
default = ["wayland"]
wayland = ["clipboard-rs/wayland"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clipboard-rs = { version = "0.3.5", default-features = false }
crc32c = "0.6"
ctrlc = { version = "3", features = ["termination"] }
prost = "0.14"
serialport = { version = "4", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
dirs = "6"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
tracing-appender = "0.2"
tracing-rolling-file = "0.1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
